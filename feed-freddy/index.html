<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed Freddy</title>
<meta name="description" content="Cook silly dishes from lots of ingredients and feed them to Freddy the monster. The more he likes it, the more coins you get.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  --night:#15123f;
  --shelf:#201c5c;
  --shelf2:#2a2575;
  --edge:#433db0;
  --cream:#fff5dc;
  --muted:#aaa5e6;
  --sun:#ffd23f;
  --berry:#d6407f;
  --orange:#ffa94d;
  --leaf:#8fe36b;
  --ink:#151233;
  --bad:#ff7a7a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--night);color:var(--cream);font-family:var(--body);font-weight:800;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px);background-size:22px 22px;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.hidden{display:none!important}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.screen{position:fixed;inset:0;overflow-y:auto}

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--display);font-size:22px;letter-spacing:.02em;
  background:var(--shelf2);border:4px solid var(--edge);border-radius:16px;padding:10px 20px;
  color:var(--cream);transition:transform .1s ease,border-color .1s ease;
}
.btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sun)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.btn.primary{background:var(--sun);border-color:#b8860b;color:var(--ink)}
.btn.go{background:var(--leaf);border-color:#4f9a35;color:var(--ink)}
.btn.small{font-size:17px;padding:6px 12px;border-width:3px;border-radius:12px}
.btn:disabled{opacity:.45}

/* ---------- Menu ---------- */
#menu .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px 32px;text-align:center}
#menu h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,11vw,92px);line-height:.95;margin:0;color:var(--sun);text-shadow:0 6px 0 var(--berry)}
#menu .lede{margin:0;color:var(--muted);font-size:19px;max-width:30ch}
#menuFreddy{width:min(260px,52vw);height:auto}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu-btns .btn{width:100%}
.toggles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.allgames{color:var(--muted);font-size:17px}
.allgames:hover{color:var(--cream)}
.menu-coins{font-size:20px;color:var(--sun)}

/* ---------- Game layout ---------- */
#game{display:grid;grid-template-rows:auto 1fr;height:100%;overflow:hidden}
.bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-left,0px));
  background:rgba(10,8,40,.55);border-bottom:3px solid var(--edge);
}
.bar .title{font-family:var(--display);font-size:26px;color:var(--sun);margin-right:auto;white-space:nowrap}
.coinbox{font-family:var(--display);font-size:24px;background:var(--ink);border:3px solid #b8860b;border-radius:999px;padding:4px 14px;color:var(--sun);white-space:nowrap}
.coinbox.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.stage{display:grid;grid-template-columns:minmax(300px,40%) 1fr;gap:18px;padding:14px 16px 16px;min-height:0}
.freddy-side{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0;position:relative}
#gameFreddyBox{width:100%;display:flex;justify-content:center;flex:0 1 auto;min-height:0}
#fgame{width:100%;max-width:380px;height:auto;max-height:52vh;flex:0 1 auto;cursor:pointer;touch-action:manipulation}
.kitchen{display:flex;flex-direction:column;gap:10px;min-height:0}

/* Thought / speech bubble */
.bubble{
  position:relative;width:100%;max-width:440px;background:var(--cream);color:var(--ink);
  border-radius:24px;padding:14px 18px 16px;text-align:center;margin-bottom:14px;
  box-shadow:0 6px 0 rgba(0,0,0,.25);
}
.bubble.think::after,.bubble.think::before{content:"";position:absolute;background:var(--cream);border-radius:50%}
.bubble.think::after{width:22px;height:22px;bottom:-16px;left:50%;margin-left:-30px}
.bubble.think::before{width:12px;height:12px;bottom:-30px;left:50%;margin-left:-44px}
.bubble.speak::after{content:"";position:absolute;bottom:-18px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--cream);border-bottom:0}
.bubble .small{font-size:16px;color:#5a5490}
.bubble .want{font-family:var(--display);font-size:clamp(22px,2.6vw,28px);line-height:1.25;margin-top:2px}
.bubble .reroll{margin-top:8px;background:none;border:0;color:#5a5490;font-size:15px;text-decoration:underline}
.chip{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 12px 3px;
  font-family:var(--display);color:var(--ink);border:3px solid rgba(0,0,0,.25);vertical-align:middle;white-space:nowrap;
}
button.chip{cursor:pointer}
.chip .emo{font-size:.9em}
.tier{font-family:var(--display);font-size:clamp(28px,3.4vw,38px);line-height:1.05}
.tier.yuck{color:#7a4a9a}.tier.meh{color:#8a7a40}.tier.like{color:#2f8f3a}.tier.love{color:#d6407f}.tier.best{color:#e07b00}
.dishname{font-size:17px;color:#5a5490;margin:4px 0 6px}
.reasons{list-style:none;margin:6px 0 4px;padding:0;text-align:left;font-size:16px;display:flex;flex-direction:column;gap:3px}
.reasons li{padding:3px 10px;border-radius:10px;background:#efe6cc}
.reasons li.good{background:#d8f5c8}
.reasons li.bad{background:#ffd9d4}
.reasons li.hint{background:#e4e2ff}
.reasons .new{font-family:var(--display);font-size:13px;background:var(--berry);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.coinsgot{font-family:var(--display);font-size:30px;color:#b8860b;margin:6px 0}
.coinsgot.zero{color:#8a849f;font-size:20px}

/* Counter: bowl, methods, feed */
.counter{background:var(--shelf);border:4px solid var(--edge);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bowl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bowl{display:flex;gap:8px;flex-wrap:wrap}
.slot{
  width:64px;height:64px;border-radius:16px;border:3px dashed var(--edge);background:var(--night);
  display:grid;place-items:center;font-size:38px;padding:0;position:relative;
}
.slot.full{border-style:solid;border-color:var(--orange);background:#2e2760}
.slot.full:hover::after{content:"✕";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:var(--ink);font-size:13px;display:grid;place-items:center;font-family:var(--body);font-weight:900}
.dishpreview{flex:1;min-width:160px;font-size:17px;color:var(--muted)}
.dishpreview b{display:block;color:var(--cream);font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.methods{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.methods .lbl{color:var(--muted);font-size:16px;margin-right:2px}
.method{
  display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:19px;
  background:var(--night);border:3px solid var(--edge);border-radius:14px;padding:6px 12px;
}
.method .emo{font-size:22px}
.method.on{background:var(--orange);border-color:#b86a12;color:var(--ink)}
.feed-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#feedBtn{flex:1;font-size:26px;padding:12px 20px;min-width:220px}
#clearBtn{flex:0 0 auto}
.cook-mix .bowl{animation:stir .3s linear 3}
.cook-bake .bowl{animation:glow .9s ease}
.cook-fry .bowl{animation:sizzle .1s linear 9}
.cook-blend .bowl{animation:whirl .45s linear 2}
@keyframes stir{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #ff8a2a) brightness(1.3)}}
@keyframes sizzle{25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
@keyframes whirl{50%{transform:scale(.9) rotate(8deg)}}

/* Ingredient shelf */
.shelf-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shelf-head .lbl{font-family:var(--display);font-size:20px;margin-right:4px}
.fchip{font-size:15px;padding:3px 10px;border-radius:999px;border:3px solid var(--edge);background:var(--night);color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.fchip.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.shelf{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;align-content:start;padding:2px 4px 8px 2px}
.ing{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--shelf);border:3px solid var(--edge);border-radius:16px;padding:8px 4px 6px;text-align:center;
  transition:transform .1s ease,border-color .1s ease;
}
.ing:hover:not(:disabled){transform:translateY(-2px);border-color:var(--sun)}
.ing:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ing .big{font-size:40px}
.ing .nm{font-size:14px;line-height:1.1}
.ing .tg{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;font-size:13px}
.ing.sel{border-color:var(--orange);background:#3b2e6e}
.ing.sel::before{content:"✓";position:absolute;top:4px;left:6px;color:var(--orange);font-weight:900;font-size:18px}
.ing .badge{position:absolute;top:4px;right:5px;font-size:15px}
.tagdot{display:inline-block;padding:0 5px;border-radius:7px;color:var(--ink);font-size:11px;line-height:16px}

/* Flying things */
.flyer{position:fixed;left:0;top:0;pointer-events:none;z-index:50;font-family:var(--emoji);line-height:1}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:49;pointer-events:none;border-radius:2px}

/* Freddy animations */
.freddy-svg .fr-all{transform-box:fill-box;transform-origin:50% 100%}
.freddy-svg.idle .fr-all{animation:breathe 2.6s ease-in-out infinite}
.freddy-svg.jump .fr-all{animation:jump .5s ease 3}
.freddy-svg.hop .fr-all{animation:hop .45s ease 2}
.freddy-svg.wiggle .fr-all{animation:wiggle .35s ease 3}
.freddy-svg.shake .fr-all{animation:shake .12s linear 6}
.freddy-svg.chomp .fr-all{animation:chomp .3s ease 3}
.freddy-svg.wave .fr-arm-l{animation:waveL .4s ease 4}
.freddy-svg.wave .fr-arm-r{animation:waveR .4s ease 4}
.fr-arm-l,.fr-arm-r{transform-box:fill-box}
.fr-arm-l{transform-origin:100% 0}
.fr-arm-r{transform-origin:0 0}
.fr-eyes-n{transform-box:fill-box;transform-origin:50% 50%;transition:transform .08s}
.fr-eyes-n.blink{transform:scaleY(.1)}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.015,.985)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-28px) scale(1.03,.98)}70%{transform:translateY(0) scale(1.05,.94)}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes chomp{50%{transform:scale(1.04,.95)}}
@keyframes waveL{50%{transform:rotate(35deg)}}
@keyframes waveR{50%{transform:rotate(-35deg)}}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(8,6,30,.75);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px}
.panel{width:min(860px,100%);background:var(--shelf);border:4px solid var(--edge);border-radius:24px;padding:18px 20px 22px;position:relative}
.panel h2{font-family:var(--display);font-weight:400;font-size:36px;margin:0 0 6px;color:var(--sun)}
.panel h3{font-family:var(--display);font-weight:400;font-size:24px;margin:16px 0 8px}
.panel p{margin:6px 0;font-size:17px;line-height:1.45}
.panel .close{position:absolute;top:12px;right:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.tab{font-family:var(--display);font-size:19px;padding:6px 14px;border-radius:12px;border:3px solid var(--edge);background:var(--night)}
.tab.on{background:var(--sun);color:var(--ink);border-color:#b8860b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--night);border:3px solid var(--edge);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.card .big{font-size:44px}
.card .nm{font-size:17px}
.card .price{font-family:var(--display);color:var(--sun);font-size:19px}
.card.owned{border-color:#4f9a35}
.card svg{width:110px;height:90px}
.swatch{width:64px;height:64px;border-radius:50%;border:4px solid var(--cream)}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.note{background:var(--night);border:3px solid var(--edge);border-radius:14px;padding:8px;text-align:center;font-size:15px}
.note .big{font-size:34px}
.note.unknown{color:var(--muted);border-style:dashed}
.howto li{margin:6px 0;font-size:17px;line-height:1.4}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.picker button{font-size:30px;padding:6px 0;border-radius:12px;border:3px solid var(--edge);background:var(--night)}
.picker button.on{border-color:var(--sun);background:#3b2e6e}
.inv-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.inv-row > div{flex:1;min-width:240px}
input.name{font:inherit;font-size:20px;width:100%;padding:8px 12px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:var(--cream)}
input.name:focus{outline:3px solid var(--sun)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--night);border:3px solid var(--edge);border-radius:14px;padding:8px 14px;font-size:16px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--sun);display:block}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);border:3px solid var(--sun);border-radius:14px;padding:10px 18px;z-index:60;font-size:18px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* ---------- Narrow screens: stack everything and let the page scroll ---------- */
@media (max-width:820px){
  #game{height:auto;min-height:100%;overflow:visible}
  .screen#game{overflow-y:auto}
  .stage{grid-template-columns:1fr}
  .freddy-side{flex-direction:row;align-items:flex-end;gap:8px}
  #gameFreddyBox{width:42%;max-width:220px;flex:0 0 auto}
  #fgame{max-height:none}
  .bubble{flex:1;margin-bottom:24px}
  .bubble.think::after{left:-6px;bottom:24px;margin:0}
  .bubble.think::before{left:-22px;bottom:14px;margin:0}
  .bubble.speak::after{left:-20px;bottom:30px;margin:0;border:12px solid transparent;border-right:20px solid var(--cream);border-left:0}
  .shelf{overflow:visible}
  .bar .title{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .freddy-svg .fr-all,.spin{animation:none!important}
}
</style>
</head>
<body>

<!-- ===================== Menu ===================== -->
<section id="menu" class="screen">
  <div class="wrap">
    <div id="menuFreddyBox"></div>
    <h1>Feed Freddy</h1>
    <p class="lede">Freddy the monster is hungry! Cook him something yummy and earn coins.</p>
    <div class="menu-coins" id="menuCoins"></div>
    <div class="menu-btns">
      <button class="btn primary" id="playBtn">Play</button>
      <button class="btn" id="howBtn">How to play</button>
    </div>
    <div class="toggles">
      <button class="btn small" id="musicBtn"></button>
      <button class="btn small" id="sfxBtn"></button>
      <button class="btn small" id="resetBtn">Start over</button>
    </div>
    <a class="allgames" href="../">← All games</a>
  </div>
</section>

<!-- ===================== Game ===================== -->
<section id="game" class="screen hidden">
  <header class="bar">
    <button class="btn small" id="menuBtn">☰ Menu</button>
    <span class="title">Feed Freddy</span>
    <button class="btn small" id="shopBtn"><span class="emo">🛒</span> Shop</button>
    <button class="btn small" id="inventBtn"><span class="emo">🧪</span> Invent</button>
    <button class="btn small" id="bookBtn"><span class="emo">📓</span> Notebook</button>
    <span class="coinbox" id="coinBox"><span class="emo">🪙</span> 0</span>
  </header>
  <div class="stage">
    <div class="freddy-side">
      <div class="bubble think" id="bubble"></div>
      <div id="gameFreddyBox"></div>
    </div>
    <div class="kitchen">
      <div class="counter" id="counter">
        <div class="bowl-row">
          <div class="bowl" id="bowl"></div>
          <div class="dishpreview" id="dishPreview"></div>
        </div>
        <div class="methods" id="methods"></div>
        <div class="feed-row">
          <button class="btn go" id="feedBtn">Feed Freddy!</button>
          <button class="btn small" id="clearBtn">Empty bowl</button>
        </div>
      </div>
      <div class="shelf-head" id="shelfHead"></div>
      <div class="shelf" id="shelf"></div>
    </div>
  </div>
</section>

<div class="modal hidden" id="modal"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   LOGIC-BEGIN  (pure game rules: no DOM, so a Node script can test them)
   ========================================================= */
const TAGS = {
  sweet:   { label:'Sweet',   icon:'🍬', color:'#ff9fcf' },
  salty:   { label:'Salty',   icon:'🧂', color:'#cfd8e8' },
  sour:    { label:'Sour',    icon:'🍋', color:'#f4ef6a' },
  spicy:   { label:'Spicy',   icon:'🔥', color:'#ff8a5c' },
  cheesy:  { label:'Cheesy',  icon:'🧀', color:'#ffd23f' },
  crunchy: { label:'Crunchy', icon:'💥', color:'#e8b874' },
  fruity:  { label:'Fruity',  icon:'🍒', color:'#ff7a8a' },
  veggie:  { label:'Veggie',  icon:'🌱', color:'#8fe36b' },
  meaty:   { label:'Meaty',   icon:'🍖', color:'#d99a7a' },
  creamy:  { label:'Creamy',  icon:'🥛', color:'#f3ecff' },
};
const TAG_IDS = Object.keys(TAGS);

const METHODS = {
  mix:   { label:'Mix',   icon:'🥣', adj:'mixed' },
  bake:  { label:'Bake',  icon:'🥧', adj:'baked' },
  fry:   { label:'Fry',   icon:'🍳', adj:'fried' },
  blend: { label:'Blend', icon:'🌀', adj:'blended' },
};
const METHOD_IDS = Object.keys(METHODS);

// price 0 = you start with it. Don't rename ids: saves keep them.
const INGREDIENTS = [
  { id:'strawberry', emoji:'🍓', name:'Strawberry', tags:['sweet','fruity'], price:0 },
  { id:'banana',     emoji:'🍌', name:'Banana',     tags:['sweet','fruity'], price:0 },
  { id:'apple',      emoji:'🍎', name:'Apple',      tags:['fruity','crunchy'], price:0 },
  { id:'lemon',      emoji:'🍋', name:'Lemon',      tags:['sour','fruity'], price:0 },
  { id:'carrot',     emoji:'🥕', name:'Carrot',     tags:['veggie','crunchy'], price:0 },
  { id:'tomato',     emoji:'🍅', name:'Tomato',     tags:['veggie','sour'], price:0 },
  { id:'potato',     emoji:'🥔', name:'Potato',     tags:['veggie','salty'], price:0 },
  { id:'chili',      emoji:'🌶️', name:'Chili Pepper', tags:['spicy','veggie'], price:0 },
  { id:'cheese',     emoji:'🧀', name:'Cheese',     tags:['cheesy','salty'], price:0 },
  { id:'bread',      emoji:'🍞', name:'Bread',      tags:['crunchy'], price:0 },
  { id:'egg',        emoji:'🥚', name:'Egg',        tags:['creamy'], price:0 },
  { id:'milk',       emoji:'🥛', name:'Milk',       tags:['creamy'], price:0 },
  { id:'chocolate',  emoji:'🍫', name:'Chocolate',  tags:['sweet','creamy'], price:0 },
  { id:'chicken',    emoji:'🍗', name:'Chicken',    tags:['meaty','salty'], price:0 },

function listNames(ings){

/* Rate a dish. ings: ingredient objects (no repeats), method: METHOD id, cr: craving,
   tastes: { fav:Set, yuck:Set }. Returns { score, tier, reasons, combos, favs, yucks }.
   Reasons: { kind:'good'|'bad'|'hint', text, pts }. */
function rateDish(ings, method, cr, tastes){
  const reasons = [];
  let score = 0;
  const add = (kind, text, pts) => { reasons.push({ kind, text, pts }); score += pts; };
  const flavorLabel = t => TAGS[t].label.toLowerCase();

  if (cr.type === 'flavor' || cr.type === 'two' || cr.type === 'flavmeth') {
    const tags = cr.tags;
    const what = tags.map(flavorLabel).join(' or ');
    const methodOk = cr.type !== 'flavmeth' || method === cr.method;
    if (cr.type === 'flavmeth') {
      if (methodOk) add('good', `It's ${METHODS[cr.method].adj}!`, 3);
      else add('bad', `I wanted it ${METHODS[cr.method].adj}, not ${METHODS[method].adj}`, 0);
    }
    let allHit = true;
    for (const t of tags) {
      const n = ings.filter(i => hasTag(i, t)).length;
      const table = cr.type === 'flavor' ? [0, 3, 5, 6] : [0, 2, 3];
      const pts = table[Math.min(n, table.length - 1)];
      if (n > 0) add('good', `${n} ${flavorLabel(t)} thing${n > 1 ? 's' : ''}`, pts);
      else add('bad', `Nothing ${flavorLabel(t)}`, 0);
      if (n < table.length - 1) allHit = false;
    }
    const off = ings.filter(i => !tags.some(t => hasTag(i, t)));
    if (off.length) add('bad', `${listNames(off)} ${off.length > 1 ? "aren't" : "isn't"} ${what}`, -off.length);
    else if (allHit && methodOk) add('good', `Everything is ${what}!`, 1);
    else if (ings.length && !allHit) add('hint', `Add more ${tags.length > 1 ? tags.map(flavorLabel).join(' and ') : flavorLabel(tags[0])} things for more coins`, 0);
  } else if (cr.type === 'method') {
    if (method === cr.method) {
      add('good', `It's ${METHODS[cr.method].adj}!`, 5);
      if (ings.length >= 3) add('good', 'Big and filling!', 2);
      else add('hint', 'Put in 3 or more things for more coins', 0);
    } else add('bad', `I wanted it ${METHODS[cr.method].adj}, not ${METHODS[method].adj}`, 0);
  } else if (cr.type === 'specific') {
    const want = ings.find(i => i.id === cr.ing);
    if (want) {
      add('good', `It has ${want.name}!`, 5);
      if (ings.length >= 3) add('good', 'Big and filling!', 2);
      else add('hint', 'Put in 3 or more things for more coins', 0);
    } else add('bad', `No ${cr.name || 'of what I wanted'}`, 0);
  }

  // Yum combos (the first two count for points; all of them get found)
  const combos = [];
  for (let a = 0; a < ings.length; a++) for (let b = a + 1; b < ings.length; b++) {
    const k = comboKey(ings[a].id, ings[b].id);
    if (COMBO_KEYS.has(k)) combos.push({ key:k, a:ings[a], b:ings[b] });
  }
  combos.forEach((c, i) => add('good', `Yum combo: ${c.a.name} + ${c.b.name}!`, i < 2 ? 2 : 0));

  const favs = ings.filter(i => tastes.fav.has(i.id));
  const yucks = ings.filter(i => tastes.yuck.has(i.id));
  for (const f of favs) add('good', `I LOVE ${f.name}!`, 2);
  for (const y of yucks) add('bad', `${y.name} is yucky to me!`, -4);

  return { score, tier: tierFor(score), reasons, combos, favs, yucks };
}

/* What will Freddy ask for? pool: ingredient objects you own. Only asks for things you can
   make into a "LOVE" dish without using one of his yucky foods. */
function cravingOptions(pool, tastes){
  const ok = pool.filter(i => !tastes.yuck.has(i.id));
  const count = t => ok.filter(i => hasTag(i, t)).length;
  const opts = { flavor:[], two:[], method:[], flavmeth:[], specific:[] };
  for (const t of TAG_IDS) {
    if (count(t) >= 3) opts.flavor.push({ type:'flavor', tags:[t] });
    if (count(t) >= 2) for (const m of METHOD_IDS) opts.flavmeth.push({ type:'flavmeth', tags:[t], method:m });
  }
  for (let a = 0; a < TAG_IDS.length; a++) for (let b = a + 1; b < TAG_IDS.length; b++) {
    const t = TAG_IDS[a], u = TAG_IDS[b];
    if (count(t) >= 2 && count(u) >= 2) opts.two.push({ type:'two', tags:[t, u] });
  }
  if (ok.length >= 3) for (const m of METHOD_IDS) {
    opts.method.push({ type:'method', method:m });
    for (const i of ok) opts.specific.push({ type:'specific', ing:i.id, name:i.name, emoji:i.emoji });
  }
  return opts;
}
const CRAVING_WEIGHTS = { flavor:30, two:20, method:12, flavmeth:22, specific:16 };
const cravingKey = c => [c.type, (c.tags || []).join(','), c.method || '', c.ing || ''].join('|');
function makeCraving(pool, tastes, rand, lastKey){
  const opts = cravingOptions(pool, tastes);
  // de-duplicate specific cravings (they were pushed once per method)
  const seen = new Set();
  opts.specific = opts.specific.filter(c => !seen.has(c.ing) && seen.add(c.ing));
  for (let tries = 0; tries < 20; tries++) {
    const types = Object.keys(opts).filter(k => opts[k].length);
    if (!types.length) return { type:'method', method:'mix' };
    let total = types.reduce((s, k) => s + CRAVING_WEIGHTS[k], 0), r = rand() * total, type = types[0];
    for (const k of types) { r -= CRAVING_WEIGHTS[k]; if (r < 0) { type = k; break; } }
    const list = opts[type];
    const c = list[Math.floor(rand() * list.length)];
    if (cravingKey(c) !== lastKey || tries === 19) return c;
  }
}

/* Name the dish, like "Strawberry & Chocolate Cake". Returns { name, emoji }. */
function dishKind(ings, method){
  const n = t => ings.filter(i => hasTag(i, t)).length;
  const has = id => ings.some(i => i.id === id);
  const half = ings.length / 2;
  const savory = n('veggie') + n('meaty') + n('salty') + n('cheesy');
  if (method === 'mix') {
    if (has('bread')) return ['Sandwich', '🥪'];
    if (n('sweet') > half && n('creamy')) return ['Sundae', '🍨'];
    if (n('fruity') >= half && n('fruity')) return ['Fruit Salad', '🥗'];
    if (n('veggie') || n('meaty')) return ['Salad', '🥗'];
    return ['Snack Bowl', '🥣'];
  }
  if (method === 'bake') {
    if ((n('cheesy')) && (has('tomato') || has('bread'))) return ['Pizza', '🍕'];
    if (n('sweet') > half) return n('creamy') ? ['Cake', '🍰'] : ['Pie', '🥧'];
    if (has('bread')) return ['Toast', '🍞'];
    if (n('meaty')) return ['Pot Pie', '🥧'];
    if (n('sweet')) return ['Muffins', '🧁'];
    return ['Casserole', '🥘'];
  }
  if (method === 'fry') {
    if (has('potato')) return ['Fries', '🍟'];
    if (has('egg')) return ['Omelet', '🍳'];
    if (n('meaty')) return ['Nuggets', '🍗'];
    if (n('sweet') > half) return ['Donuts', '🍩'];
    return ['Fritters', '🧆'];
  }
  // blend
  if (savory > n('sweet') + n('fruity')) return ['Soup', '🍲'];
  if (n('creamy')) return ['Milkshake', '🥤'];
  return ['Smoothie', '🍹'];
}
function dishName(ings, method){
  if (!ings.length) return { name:'', emoji:'🥣' };
  const [noun, emoji] = dishKind(ings, method);
  const lead = ings.slice(0, 2).map(i => i.name);
  const pre = ings.length >= 5 ? 'Mega ' : ings.length >= 3 ? 'Super ' : '';
  return { name: pre + lead.join(' & ') + ' ' + noun, emoji };
}

const SAVE_KEY = 'feedfreddy.v1';
const MAX_CUSTOM = 12;
const INVENT_PRICE = 25;
const INVENT_EMOJI = ['🦄','🌟','💎','🍄','🌸','🌻','🍀','🍁','🌰','🎃','🐙','🦑','🐸','🦖','🐝','👽','🧁','🍮','🍡','🍧','🥟','🥠','🧃','🍥','🫧','🌵','🔮','🪐','❄️','🧊','💚','💜','🍫','🥐','🥯','🧇','🍙','🥜','🍑','🍐','🫛','🥬','🍠','🧋','🍵','🌮','🍝','🎂'];
function randomTastes(){
  const ids = INGREDIENTS.map(i => i.id);
  const pick = () => ids.splice(Math.floor(Math.random() * ids.length), 1)[0];
  return { fav:[pick(), pick(), pick()], yuck:[pick(), pick()] };
}
function defaultSave(){
  const t = randomTastes();
  return { coins:0, owned:[...STARTERS], custom:[], nextCustom:1, freeInvent:true,
    hats:[], hat:'', colors:['green'], color:'green',
    fav:t.fav, yuck:t.yuck, knownFav:[], knownYuck:[], combos:[],
    stats:{ dishes:0, loves:0, bests:0, earned:0 }, music:true, sfx:true };
}
const num = (v, max) => Number.isFinite(v) && v >= 0 ? Math.min(max, Math.floor(v)) : 0;
const strArr = v => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
function loadSave(){
  const d = defaultSave();
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }
  catch (e) { raw = null; try { localStorage.removeItem(SAVE_KEY); } catch (e2) {} }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return d;
  d.coins = num(raw.coins, 9999999);
  d.owned = [...new Set([...STARTERS, ...strArr(raw.owned).filter(id => ING_BY_ID.has(id))])];
  if (Array.isArray(raw.custom)) {
    const ids = new Set();
    for (const c of raw.custom) {
      if (d.custom.length >= MAX_CUSTOM) break;
      if (!c || typeof c !== 'object') continue;
      if (typeof c.id !== 'string' || !/^c\d{1,6}$/.test(c.id) || ids.has(c.id)) continue;
      const name = typeof c.name === 'string' ? c.name.replace(/\s+/g, ' ').trim().slice(0, 16) : '';
      if (!name || !INVENT_EMOJI.includes(c.emoji)) continue;
      const tags = [...new Set(strArr(c.tags).filter(t => TAGS[t]))].slice(0, 2);
      if (!tags.length) continue;
      ids.add(c.id);
      d.custom.push({ id:c.id, name, emoji:c.emoji, tags, custom:true });
    }
  }
  d.nextCustom = Math.max(num(raw.nextCustom, 999999), 1, ...d.custom.map(c => +c.id.slice(1) + 1));
  if (typeof raw.freeInvent === 'boolean') d.freeInvent = raw.freeInvent;
  d.hats = [...new Set(strArr(raw.hats).filter(id => HAT_BY_ID.has(id)))];
  d.hat = typeof raw.hat === 'string' && d.hats.includes(raw.hat) ? raw.hat : '';
  d.colors = [...new Set(['green', ...strArr(raw.colors).filter(id => COLOR_BY_ID.has(id))])];
  d.color = typeof raw.color === 'string' && d.colors.includes(raw.color) ? raw.color : 'green';
  const fav = [...new Set(strArr(raw.fav).filter(id => ING_BY_ID.has(id)))];
  const yuck = [...new Set(strArr(raw.yuck).filter(id => ING_BY_ID.has(id) && !fav.includes(id)))];
  if (fav.length === 3 && yuck.length === 2) { d.fav = fav; d.yuck = yuck; }
  d.knownFav = [...new Set(strArr(raw.knownFav).filter(id => d.fav.includes(id)))];
  d.knownYuck = [...new Set(strArr(raw.knownYuck).filter(id => d.yuck.includes(id)))];
  d.combos = [...new Set(strArr(raw.combos).filter(k => COMBO_KEYS.has(k)))];
  if (raw.stats && typeof raw.stats === 'object') for (const k of Object.keys(d.stats)) d.stats[k] = num(raw.stats[k], 99999999);
  if (typeof raw.music === 'boolean') d.music = raw.music;
  if (typeof raw.sfx === 'boolean') d.sfx = raw.sfx;
  return d;
}

let actx = null, musicGain = null, sfxGain = null, noiseBuf = null, musicTimer = 0, nextNote = 0, step = 0;
function audioInit(){
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
    musicGain = actx.createGain(); musicGain.gain.value = save.music ? 0.22 : 0; musicGain.connect(master);
    sfxGain = actx.createGain(); sfxGain.gain.value = save.sfx ? 0.7 : 0; sfxGain.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.6, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNote = actx.currentTime + 0.1;
    musicTimer = setInterval(musicTick, 25);
  } catch (e) { actx = null; }
}
addEventListener('pointerdown', audioInit, true);
addEventListener('keydown', audioInit, true);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null, when = 0, dest = null){
  if (!actx) return;
  const t0 = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol = 0.2, freq = 1200, when = 0, q = 1, type = 'bandpass'){
  if (!actx) return;
  const t0 = actx.currentTime + when;
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(sfxGain); s.start(t0); s.stop(t0 + dur + 0.05);
}
const sfx = {
  pick(){ tone(520, 0.09, 'sine', 0.25, 880); },

    if (m === 'mix') for (let i = 0; i < 6; i++) tone(300 + (i % 2) * 80, 0.07, 'triangle', 0.15, null, i * 0.14);
    else if (m === 'bake') { noise(0.8, 0.06, 400, 0, 0.5, 'lowpass'); tone(1568, 0.6, 'sine', 0.2, null, 0.75); tone(2093, 0.5, 'sine', 0.12, null, 0.75); }
    else if (m === 'fry') noise(0.9, 0.16, 5000, 0, 0.6, 'highpass');
    else { tone(120, 0.9, 'sawtooth', 0.07, 260); noise(0.9, 0.05, 900, 0, 2); }
  },
  whoosh(){ noise(0.35, 0.12, 1800, 0, 1.5); },

  coin(when = 0){ tone(1976, 0.07, 'square', 0.06, null, when); tone(2637, 0.18, 'square', 0.06, null, when + 0.06); },

  burp(){ if (!actx) return; const t0 = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(95, t0); o.frequency.linearRampToValueAtTime(70, t0 + 0.5);
    lfo.frequency.value = 28; lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency);
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.connect(f); f.connect(g); g.connect(sfxGain); o.start(t0); lfo.start(t0); o.stop(t0 + 0.6); lfo.stop(t0 + 0.6); },
  giggle(){ for (let i = 0; i < 4; i++) tone(700 + i * 60, 0.08, 'sine', 0.15, 900 + i * 60, i * 0.09); },
  tier(id){
    const seq = {
      yuck:[[392,0,.25,'sawtooth',330],[330,.28,.25,'sawtooth',262],[262,.56,.5,'sawtooth',196]],
      meh:[[440,0,.18,'triangle'],[440,.22,.3,'triangle']],
      like:[[523,0,.12,'triangle'],[659,.12,.12,'triangle'],[784,.24,.3,'triangle']],
      love:[[523,0,.1,'square'],[659,.1,.1,'square'],[784,.2,.1,'square'],[1047,.3,.4,'square']],
      best:[[523,0,.1,'square'],[659,.1,.1,'square'],[784,.2,.1,'square'],[1047,.3,.15,'square'],[784,.45,.1,'square'],[1047,.55,.6,'square']],

// Gentle bouncy kitchen music: 4 chords, 16 steps each.
const CHORDS = [[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
const MELODY = [72,null,76,null,79,null,76,74, 72,null,69,null,72,null,null,null,
                69,null,72,null,76,null,74,72, 69,null,67,null,69,null,null,null,
                65,null,69,null,72,null,74,72, 69,null,65,null,69,null,72,null,
                67,null,71,null,74,null,72,71, 67,null,74,null,71,null,null,null];
function musicTick(){
  if (!actx || !save.music || actx.state !== 'running') { if (actx) nextNote = actx.currentTime + 0.1; return; }
  const spb = 60 / 104 / 2;
  while (nextNote < actx.currentTime + 0.12) {
    const bar = Math.floor(step / 16) % 4, s = step % 16, w = nextNote - actx.currentTime;
    const ch = CHORDS[bar];
    if (s % 4 === 0) tone(mtof(ch[0] - 12), spb * 1.6, 'triangle', 0.35, null, w, musicGain);
    if (s % 4 === 2) for (const n of ch) tone(mtof(n + 12), spb * 0.6, 'sine', 0.07, null, w, musicGain);
    const m = MELODY[(step % 64)];
    if (m && (Math.floor(step / 64) % 2 === 0 || s < 8)) tone(mtof(m), spb * 1.4, 'square', 0.05, null, w, musicGain);
    nextNote += spb; step++;
  }
}

/* ---------- Feeding ---------- */
function mouthPoint(){
  const r = gameFreddy.getBoundingClientRect();
  return { x: r.left + r.width * 150 / 300, y: r.top + r.height * 200 / 340 };
}
async function fly(html, from, to, ms, size, scaleTo = 0.4){
  const el = document.createElement('div');
  el.className = 'flyer'; el.innerHTML = html; el.style.fontSize = size + 'px';
  document.body.appendChild(el);
  const half = size / 2;
  const a = el.animate([
    { transform:`translate(${from.x - half}px, ${from.y - half}px) scale(1)` },
    { transform:`translate(${(from.x + to.x) / 2 - half}px, ${Math.min(from.y, to.y) - 80 - half}px) scale(${(1 + scaleTo) / 2 + 0.2})`, offset:0.5 },
    { transform:`translate(${to.x - half}px, ${to.y - half}px) scale(${scaleTo})` },
  ], { duration:ms, easing:'ease-in-out', fill:'forwards' });
  try { await a.finished; } catch (e) {}
  el.remove();
}
function confetti(){
  const colors = ['#ffd23f', '#ff5fa2', '#5fb7ff', '#8fe36b', '#ffa94d', '#a77bff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = pickOne(colors);
    document.body.appendChild(c);
    const a = c.animate([{ transform:`translateY(0) rotate(0deg)` }, { transform:`translateY(${innerHeight + 40}px) translateX(${(Math.random() - .5) * 200}px) rotate(${Math.random() * 720}deg)` }],
      { duration:1800 + Math.random() * 1600, delay:Math.random() * 500, easing:'ease-in' });
    a.onfinish = () => c.remove();
  }
}
async function feed(){
  if (phase !== 'cook' || !bowl.length) return;
  const ings = bowl.map(getIng).filter(Boolean);
  if (!ings.length) return;
  phase = 'busy'; renderBowl();
  const dish = dishName(ings, method);
  // 1. Cook
  const counter = $('counter');
  counter.classList.add('cook-' + method); sfx.cook(method);
  await sleep(950);
  counter.classList.remove('cook-' + method);
  // 2. Dish appears and flies to Freddy
  const br = $('bowl').getBoundingClientRect();
  const from = { x: br.left + Math.min(br.width, 200) / 2, y: br.top + br.height / 2 };
  bowl = []; renderBowl(); renderShelf();
  setFace(gameFreddy, 'normal', 'open'); setAnim(gameFreddy, 'hop');
  sfx.whoosh();
  await fly(`<span>${dish.emoji}</span>`, from, mouthPoint(), 750, 90, 0.35);
  // 3. Chew
  setAnim(gameFreddy, 'chomp');
  for (let i = 0; i < 3; i++) {
    setFace(gameFreddy, 'happy', i % 2 ? 'smile' : 'chew'); sfx.chomp();
    await sleep(300);
  }
  setFace(gameFreddy, 'normal', 'chew');
  await sleep(350);
  // 4. Rate it
  const r = rateDish(ings, method, craving, tastes());
  for (const c of r.combos) { if (!save.combos.includes(c.key)) { save.combos.push(c.key); markNew(r, `Yum combo: ${c.a.name} + ${c.b.name}!`); } }
  for (const f of r.favs) { if (!save.knownFav.includes(f.id)) { save.knownFav.push(f.id); markNew(r, `I LOVE ${f.name}!`); } }
  for (const y of r.yucks) { if (!save.knownYuck.includes(y.id)) { save.knownYuck.push(y.id); markNew(r, `${y.name} is yucky to me!`); } }
  save.coins = Math.min(9999999, save.coins + r.tier.coins);
  save.stats.dishes++; save.stats.earned += r.tier.coins;
  if (r.tier.id === 'love' || r.tier.id === 'best') save.stats.loves++;
  if (r.tier.id === 'best') save.stats.bests++;
  persist();
  lastResult = { tier:r.tier, says:pickOne(r.tier.says), dish, reasons:r.reasons };
  const face = { yuck:['yuck','yuck','shake'], meh:['meh','meh','idle'], like:['happy','smile','hop'], love:['love','grin','jump wave'], best:['best','grin','jump wave'] }[r.tier.id];
  setFace(gameFreddy, face[0], face[1]); setAnim(gameFreddy, face[2]);
  sfx.tier(r.tier.id);
  phase = 'result'; renderBubble(); renderShelf();
  if (r.tier.id === 'best') confetti();
  // 5. Coins fly to the coin box
  if (r.tier.coins) {
    const n = Math.min(14, Math.ceil(r.tier.coins / 3));
    const cb = $('coinBox').getBoundingClientRect(), to = { x: cb.left + 20, y: cb.top + cb.height / 2 };
    const m = mouthPoint();
    const shown = save.coins - r.tier.coins;
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        fly('🪙', { x: m.x + (Math.random() - .5) * 60, y: m.y }, to, 700, 34, 0.8).then(() => {
          sfx.coin();
          const val = i === n - 1 ? save.coins : Math.min(save.coins, shown + Math.round(r.tier.coins * (i + 1) / n));
          $('coinBox').innerHTML = `<span class="emo">🪙</span> ${val}`;
          $('coinBox').classList.remove('bump'); void $('coinBox').offsetWidth; $('coinBox').classList.add('bump');
        });
      }, 300 + i * 90);
    }
  }
  if ((r.tier.id === 'love' || r.tier.id === 'best') && Math.random() < 0.3) {
    setTimeout(() => { if (phase === 'result') { sfx.burp(); toast('*BURP!* Oops, excuse me!'); } }, 2200);
  }
}

  const nm = $('invName');
  nm.addEventListener('input', () => {
    inv.name = nm.value.slice(0, 16);
    const mk = $('invMake');
    mk.disabled = !(save.custom.length < MAX_CUSTOM && inv.name.trim() && inv.tags.length && save.coins >= price);
    $('invPreview').querySelector('.nm').textContent = inv.name.trim() || 'Your food';
  });
  $('invMake').onclick = makeInvention;
}
function makeInvention(){
  const price = save.freeInvent ? 0 : INVENT_PRICE;
  const name = inv.name.replace(/\s+/g, ' ').trim().slice(0, 16);
  if (!name || !inv.tags.length || save.custom.length >= MAX_CUSTOM || save.coins < price) { sfx.no(); return; }
  const c = { id:'c' + save.nextCustom++, name, emoji:inv.emoji, tags:[...inv.tags], custom:true };
  save.custom.push(c); save.coins -= price; save.freeInvent = false;
  persist(); sfx.buy(); updateCoins(true);
  toast(`You invented ${name}! It's on your food shelf.`);
  inv = { emoji:pickOne(INVENT_EMOJI), name:'', tags:[] };
  showInvent();
}
let delArmed = '';
$('panel').addEventListener('click', e => {
  const p = e.target.closest('[data-pic]');
  if (p) { inv.emoji = p.dataset.pic; sfx.click(); showInvent(); return; }
  const t = e.target.closest('[data-itag]');
  if (t) {
    const k = t.dataset.itag;
    if (inv.tags.includes(k)) inv.tags = inv.tags.filter(x => x !== k);
    else if (inv.tags.length < 2) inv.tags.push(k);
    else { inv.tags.shift(); inv.tags.push(k); }
    sfx.click(); showInvent(); return;
  }
  const d = e.target.closest('[data-del]');
  if (d) {
    const id = d.dataset.del;
    if (delArmed !== id) { delArmed = id; d.textContent = 'Sure? Tap again'; return; }
    delArmed = '';
    save.custom = save.custom.filter(c => c.id !== id);
    bowl = bowl.filter(x => x !== id);
    if (craving && craving.ing === id) craving = null;
    persist(); sfx.drop(); showInvent();
    if (!craving && phase === 'cook') newCraving();
  }
});
$('inventBtn').onclick = () => { if (phase === 'busy') return; sfx.click(); showInvent(); };

/* ---------- Boot ---------- */
$('menuFreddyBox').innerHTML = freddySVG('fmenu');
$('gameFreddyBox').innerHTML = freddySVG('fgame');
menuFreddy = $('fmenu'); menuFreddy.id = 'fmenu'; menuFreddy.style.width = 'min(260px,52vw)'; menuFreddy.style.height = 'auto';
gameFreddy = $('fgame'); gameFreddy.addEventListener('click', tickle);
gameFreddy.id = 'fgame'; gameFreddy.classList.add('gf');
showMenu();
</script>
