<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kid Games</title>
<meta name="description" content="Browser games for kids: math, words and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: an arcade shelf. Big title, then a grid of game cards (art on top, name, blurb, tags), one "more coming" slot. */
:root{
  --night:#15123f;
  --shelf:#201c5c;
  --edge:#433db0;
  --cream:#fff5dc;
  --muted:#aaa5e6;
  --sun:#ffd23f;
  --berry:#d6407f;
  --ink:#151233;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--night);color:var(--cream);font-family:var(--body);font-weight:800;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px);background-size:22px 22px;
}
.wrap{
  max-width:1040px;margin:0 auto;box-sizing:border-box;
  padding-block:40px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px;
}
header{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,76px);line-height:.95;margin:0;color:var(--sun);text-shadow:0 5px 0 var(--berry);letter-spacing:.01em}
.lede{margin:0;font-size:clamp(17px,2.4vw,20px);color:var(--muted);max-width:44ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.game{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--shelf);border:4px solid var(--edge);border-radius:22px;overflow:hidden;
  transition:transform .15s ease,border-color .15s ease;
}
.game:hover{transform:translateY(-4px);border-color:var(--accent,var(--sun))}
.game:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.art{aspect-ratio:16/9;background:var(--art-bg,var(--ink));display:grid;place-items:center;overflow:hidden}
.art svg{width:100%;height:100%}
.info{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1}
.info h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1;color:var(--accent,var(--sun))}
.info p{margin:0;font-size:16px;line-height:1.4;color:var(--cream)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--night);border:2px solid var(--edge);color:var(--muted);border-radius:999px;padding:3px 10px}
.play{align-self:flex-start;margin-top:4px;font-family:var(--display);font-size:20px;background:var(--accent,var(--sun));color:var(--ink);border-radius:12px;padding:8px 18px}
.soon{
  border:4px dashed var(--edge);border-radius:22px;display:grid;place-items:center;text-align:center;
  padding:28px;color:var(--muted);min-height:200px;
}
.soon b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--cream);margin-bottom:6px}
footer{color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.game{transition:none}.game:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kid Games</h1>
    <p class="lede">Pick a game to play. Everything runs right in your browser.</p>
  </header>

  <main class="shelf" id="shelf"></main>

  <footer>Made at home. <a href="https://github.com/npyati/kid-games">See the code on GitHub</a>.</footer>
</div>

<script>
/* ---------- The game list ----------

   art is an inline SVG (viewBox 0 0 320 180) shown at the top of the card. */

    folder: 'gobble-grid',

      ${[['12',0,0],['7',1,0],['18',3,0],['5',4,0],['9',0,1],['24',2,1],['3',3,1],['15',1,2],['30',3,2]].map(([n,c,r]) => `<text x="${66 + c * 46}" y="${49 + r * 46}" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="17" fill="#fff5dc">${n}</text>`).join('')}
      <g transform="translate(78 65) scale(.42)">
        <path d="M14 60 C14 34 30 21 50 21 C70 21 86 34 86 60 C86 80 70 88 50 88 C30 88 14 80 14 60Z" fill="#8fe36b" stroke="#151233" stroke-width="5"/>
        <circle cx="38" cy="44" r="11" fill="#fff" stroke="#151233" stroke-width="3"/><circle cx="62" cy="44" r="11" fill="#fff" stroke="#151233" stroke-width="3"/>
        <circle cx="41" cy="46" r="5" fill="#151233"/><circle cx="65" cy="46" r="5" fill="#151233"/>
        <path d="M30 60 Q50 86 70 60 Z" fill="#151233"/>
      </g>
      <g transform="translate(222 112) scale(.4)">
        <polygon points="50,9 58,20 72,14 72,29 87,32 79,45 90,55 77,63 81,78 66,76 60,90 50,80 40,90 34,76 19,78 23,63 10,55 21,45 13,32 28,29 28,14 42,20" fill="#ff6b5b" stroke="#151233" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="40" cy="51" r="7" fill="#fff"/><circle cx="60" cy="51" r="7" fill="#fff"/><circle cx="40" cy="52" r="3" fill="#151233"/><circle cx="60" cy="52" r="3" fill="#151233"/>
        <path d="M28 34 L44 43 M72 34 L56 43" stroke="#151233" stroke-width="5" stroke-linecap="round"/>
      </g>
    </svg>`,
  },
  {
    folder: 'wildwood',
    title: 'Wildwood',
    blurb: 'Wander a 3D forest that goes on forever. Meet deer and rabbits, fight wolves and cave bears, craft axes, swords and armor, find giant snakes in the marshes, and hunt for a wyvern. Plays great with an Xbox controller.',
    tags: ['Explore', '3D', 'Adventure', 'Controller'],
    accent: '#8fe36b', artBg: '#9fc7e8',
    art: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <defs><linearGradient id="wwSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8fd8"/><stop offset="1" stop-color="#cfe0ee"/></linearGradient></defs>
      <rect width="320" height="180" fill="url(#wwSky)"/>
      <ellipse cx="70" cy="34" rx="34" ry="9" fill="#fff" opacity=".85"/><ellipse cx="236" cy="26" rx="26" ry="7" fill="#fff" opacity=".8"/>
      <path d="M0 104 Q60 80 130 96 T320 88 V180 H0Z" fill="#7fae55"/>
      <path d="M0 122 Q80 108 160 118 T320 112 V180 H0Z" fill="#5f9a3e"/>
      <path d="M-10 150 Q90 128 170 140 T330 132 V158 Q240 150 170 162 T-10 172Z" fill="#d9c98f"/>
      <path d="M-10 154 Q90 134 170 146 T330 138 V152 Q240 146 170 156 T-10 166Z" fill="#5aa6c4"/>
      ${[[40,96,1],[92,92,.8],[254,88,1.1],[290,96,.7]].map(([x,y,k]) => `<g transform="translate(${x} ${y}) scale(${k})"><rect x="-3" y="-4" width="6" height="16" fill="#5a3b22"/><polygon points="0,-46 -16,-14 16,-14" fill="#1f5a33"/><polygon points="0,-36 -20,-2 20,-2" fill="#24683a"/></g>`).join('')}
      <g transform="translate(176 106)"><rect x="-4" y="-10" width="8" height="24" fill="#5a3b22"/><circle cx="0" cy="-22" r="20" fill="#3f8a34"/><circle cx="-14" cy="-12" r="13" fill="#4a9a3c"/><circle cx="14" cy="-12" r="13" fill="#367a2e"/></g>
      ${[[20,178],[60,176],[118,178],[214,177],[300,178]].map(([x,y]) => `<path d="M${x} ${y} l-6 -20 l9 16 l2 -22 l4 22 l8 -15 l-5 19Z" fill="#8fe36b"/>`).join('')}
    </svg>`,
  },
  {
    folder: 'chicken-runner',
    title: 'Chicken Runner',
    blurb: 'Race rival chickens through six worlds. Jump, flap, grab Speed Corn, dodge rotten eggs, collect coins, and buy silly skins.',
    tags: ['Action', 'Racing', 'Skins', 'Controller'],
    accent: '#ffd23f', artBg: '#6ec6ff',
    art: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <defs><linearGradient id="crSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ec6ff"/><stop offset="1" stop-color="#d8f1ff"/></linearGradient></defs>
      <rect width="320" height="180" fill="url(#crSky)"/>
      <circle cx="262" cy="36" r="20" fill="#fff3a6"/>
      <ellipse cx="70" cy="34" rx="30" ry="9" fill="#fff"/><ellipse cx="190" cy="24" rx="22" ry="7" fill="#fff"/>
      <path d="M0 120 Q80 96 160 112 T320 104 V150 H0Z" fill="#86c763"/>
      <rect y="146" width="320" height="34" fill="#a8743f"/><rect y="142" width="320" height="9" fill="#5fb446"/>
      <rect x="196" y="116" width="44" height="30" rx="5" fill="#e8b84a" stroke="#b8862a" stroke-width="2"/>
      <path d="M209 116 V146 M227 116 V146" stroke="#8a5a2e" stroke-width="2.5"/>
      ${[[150,70],[178,58],[206,54],[234,58],[262,70]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="7" fill="#ffd23f" stroke="#e09a12" stroke-width="2.5"/>`).join('')}
      <g transform="translate(96 104) scale(1.25)">
        <path d="M-14 -30 L-27 -44 L-22 -30 L-30 -36 L-18 -22Z" fill="#eadcc4"/>
        <ellipse cx="-2" cy="-25" rx="18" ry="14" fill="#fff8ec" stroke="#2a1d12" stroke-width="2"/>
        <circle cx="10" cy="-40" r="10" fill="#fff8ec" stroke="#2a1d12" stroke-width="2"/>
        <ellipse cx="-2" cy="-25" rx="16.5" ry="12.5" fill="#fff8ec"/><ellipse cx="8" cy="-34" rx="7" ry="9" fill="#fff8ec" transform="rotate(17 8 -34)"/>
        <ellipse cx="-8" cy="-30" rx="11" ry="6.5" fill="#eadcc4" stroke="#2a1d12" stroke-width="1.6" transform="rotate(-25 -8 -30)"/>
        <circle cx="5" cy="-49" r="3.6" fill="#e8352f"/><circle cx="10" cy="-51" r="4" fill="#e8352f"/><circle cx="15" cy="-49" r="3.4" fill="#e8352f"/>
        <path d="M18 -43 L27 -39 L18 -35Z" fill="#ffb020" stroke="#2a1d12" stroke-width="1.4"/>
        <circle cx="13.5" cy="-42" r="2.6" fill="#2a1d12"/>
        <path d="M-3 -13 L-6 -5 M5 -13 L9 -5" stroke="#f39c12" stroke-width="3.2" stroke-linecap="round"/>
      </g>
      <path d="M40 92 H70 M34 102 H64 M42 112 H66" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    </svg>`,
  },
];

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
document.getElementById('shelf').innerHTML = GAMES.map(g => `
  <a class="game" href="${esc(g.folder)}/" style="--accent:${esc(g.accent)};--art-bg:${esc(g.artBg)}">
    <div class="art">${g.art}</div>
    <div class="info">
      <h2>${esc(g.title)}</h2>
      <p>${esc(g.blurb)}</p>
      <div class="tags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <span class="play">Play</span>
    </div>
  </a>`).join('') + `
  <div class="soon"><div><b>More games coming</b>We're building the next one now.</div></div>`;
</script>
</body>
</html>
